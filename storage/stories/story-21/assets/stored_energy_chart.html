<style>
  html,
  body,
  #vis {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: 100%;
    margin: 0;
  }
  @font-face {
    font-style: normal;
    font-family: NotesESA;
    src: url("https://storage.googleapis.com/esa-cfs-cdn/fonts/NotesEsaReg.otf");
  }

  body {
    font-family: NotesESA, Arial, Helvetica, sans-serif;
  }
</style>

<div id="vis"></div>

<script src="https://storage.googleapis.com/esa-cfs-cdn/vega/v5/vega.min.js"></script>
<script src="https://storage.googleapis.com/esa-cfs-cdn/vega-lite/v5/vega-lite.min.js"></script>
<script src="https://storage.googleapis.com/esa-cfs-cdn/vega-embed/v6/vega-embed.min.js"></script>

<script>
  const spec = {
    $schema: "https://vega.github.io/schema/vega-lite/v5.json",
    background: "rgba(0,0,0,0)",
    width: "container",
    height: 520,
    autosize: {
      type: "fit",
      contains: "padding",
    },
    data: {
      values: [
        {
          year: 1970,
          component: "Atmosphere",
          value: 4,
        },
        {
          year: 1970,
          component: "Land",
          value: 5,
        },
        {
          year: 1970,
          component: "Ice",
          value: 7,
        },
        {
          year: 1970,
          component: "Deep Ocean",
          value: 20,
        },
        {
          year: 1970,
          component: "Upper Ocean",
          value: 77,
        },
        {
          year: 1980,
          component: "Atmosphere",
          value: 6,
        },
        {
          year: 1980,
          component: "Land",
          value: 8,
        },
        {
          year: 1980,
          component: "Ice",
          value: 10,
        },
        {
          year: 1980,
          component: "Deep Ocean",
          value: 53,
        },
        {
          year: 1980,
          component: "Upper Ocean",
          value: 87,
        },
        {
          year: 1990,
          component: "Atmosphere",
          value: 8,
        },
        {
          year: 1990,
          component: "Land",
          value: 10,
        },
        {
          year: 1990,
          component: "Ice",
          value: 13,
        },
        {
          year: 1990,
          component: "Deep Ocean",
          value: 62,
        },
        {
          year: 1990,
          component: "Upper Ocean",
          value: 94,
        },
        {
          year: 2000,
          component: "Atmosphere",
          value: 14,
        },
        {
          year: 2000,
          component: "Land",
          value: 16,
        },
        {
          year: 2000,
          component: "Ice",
          value: 18,
        },
        {
          year: 2000,
          component: "Deep Ocean",
          value: 74,
        },
        {
          year: 2000,
          component: "Upper Ocean",
          value: 123,
        },
        {
          year: 2010,
          component: "Atmosphere",
          value: 18,
        },
        {
          year: 2010,
          component: "Land",
          value: 20,
        },
        {
          year: 2010,
          component: "Ice",
          value: 21,
        },
        {
          year: 2010,
          component: "Deep Ocean",
          value: 150,
        },
        {
          year: 2010,
          component: "Upper Ocean",
          value: 84,
        },
      ],
    },
    mark: {
      type: "area",
      interpolate: "linear",
    },
    encoding: {
      x: {
        field: "year",
        type: "ordinal",
        axis: {
          labelColor: "#cfd8dc",
          labelFontSize: 12,
          labelPadding: 5,
          tickSize: 0,
          domainColor: "#b0bec5",
          labelAngle: 0,
        },
      },
      y: {
        field: "value",
        type: "quantitative",
        stack: "zero",
        scale: {
          domain: [0, 300],
        },
        axis: {
          title: null,
          values: [0, 30, 60, 90, 120, 150, 180, 210, 240, 270, 300],
          labelColor: "#cfd8dc",
          labelFontSize: 12,
          grid: true,
          gridColor: "#5d7685",
          gridDash: [2, 3],
          gridOpacity: 0.7,
          domain: false,
          tickSize: 0,
          title: "Unit: ZJ",
          titleColor: "#cfd8dc",
          titleFontSize: 12,
          titleAnchor: "end",
          titlePadding: -60,
          titleFontWeight: "normal",
          titleAngle: 0,
        },
      },
      color: {
        field: "component",
        type: "nominal",
        scale: {
          domain: ["Atmosphere", "Land", "Ice", "Deep Ocean", "Upper Ocean"],
          range: [
            "#98DBCED6",
            "#00B398D6",
            "#FFFFFFD6",
            "#003349D6",
            "#007D8AD6",
          ],
        },
        legend: {
          title: null,
          orient: "bottom",
          direction: "horizontal",
          labelColor: "#cfd8dc",
          labelFontSize: 16,
          symbolType: "square",
          columns: 3,
        },
      },
      order: {
        field: "stackOrder",
        type: "quantitative",
        sort: "ascending",
      },
      tooltip: [
        {
          field: "component",
          type: "nominal",
          title: "Component",
        },
        {
          field: "value",
          type: "quantitative",
          title: "Value",
        },
      ],
    },
    config: {
      view: {
        stroke: null,
      },
      font: "NotesESA",
    },
  };

  async function loadFonts() {
    if (!document.fonts) {
      return;
    }

    try {
      await document.fonts.load("16px NotesESA");
      await document.fonts.load("18px NotesESA");
    } catch (error) {
      console.error("Error loading fonts:", error);
    }
  }

  async function renderChart() {
    await loadFonts();

    const container = document.getElementById("vis");

    spec.width = container.clientWidth;
    spec.height = container.clientHeight;

    vegaEmbed("#vis", spec, { actions: false }).then(({ view }) => {
      window.addEventListener("resize", () => {
        view.width(container.clientWidth).height(container.clientHeight).run();
      });
    });
  }

  renderChart();
</script>
