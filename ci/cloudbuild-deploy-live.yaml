steps:
  - name: 'node:22'
    id: 'ci'
    entrypoint: npm
    args: ['ci']
  - name: 'node:22'
    id: 'build'
    entrypoint: npm
    args: ['run', 'build']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: 'gcloud'
    args: ['storage', 'rsync', '--recursive', '--delete-unmatched-destination-objects', '--no-ignore-symlinks', './dist', 'gs://cfs.climate.esa.int']
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: 'set-no-cache-on-index-html'
    entrypoint: 'gcloud'
    args:
      - "storage"
      - "objects"
      - "update"
      - "--cache-control=no-cache"
      - "gs://cfs.climate.esa.int/index.html"
  - name: gcr.io/cloud-builders/git
    args:
      [
        'clone',
        '--single-branch',
        '--branch',
        '${BRANCH_NAME}',
        '--depth',
        '5',
        'https://github.com/ubilabs/esa-climate-from-space',
        'repo'
      ]
  - name: gcr.io/cloud-builders/git
    dir: 'repo'
    args: ['checkout', '${COMMIT_SHA}']
  - name: 'node:12'
    dir: 'repo'
    env:
    - 'SLACK_HOOK_URL=${_SLACK_HOOK_URL}'
    - 'BRANCH_NAME=${BRANCH_NAME}'
    entrypoint: 'node'
    args: ["./scripts/slack-deployment-notification.js"]
