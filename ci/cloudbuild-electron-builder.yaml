steps:
  - name: node:22
    entrypoint: npm
    args: ["ci"]

  - name: stedolan/jq
    entrypoint: "bash"
    args: ["-c", 'jq -r <package.json ".version" > version.txt']

  - name: gcr.io/esa-climate-from-space/electron-builder
    entrypoint: "npm"
    args: ["run", "electron:prepare-build"]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    env:
      - "CLOUDSDK_STORAGE_PROCESS_COUNT=1"
      - "CLOUDSDK_STORAGE_THREAD_COUNT=8"
    entrypoint: bash
    args:
      - -c
      - |
        ulimit -n 65536 || true
        gcloud storage cp --recursive \
          "gs://esa-cfs-tiles/$$(cat version.txt)/basemaps" \
          ./dist

  - name: gcr.io/esa-climate-from-space/electron-builder
    env:
      - "ELECTRON_CACHE=/root/.cache/electron"
      - "ELECTRON_BUILDER_CACHE=/root/.cache/electron-builder"
    entrypoint: "npm"
    args: ["run", "electron:build"]

  - name: gcr.io/esa-climate-from-space/zip
    entrypoint: "bash"
    args:
      - "-c"
      - |
        VERSION=$$(cat version.txt)
        cd /workspace/dist-electron
        zip esa-climate-from-space-$$VERSION-win.zip esa-climate-from-space-$$VERSION-win-*.exe
        zip -r esa-climate-from-space-$$VERSION-mac.zip mac*
        zip esa-climate-from-space-$$VERSION-linux.zip esa-climate-from-space-$$VERSION-linux-*.AppImage

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:alpine"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        VERSION=$$(cat version.txt)
        gcloud storage cp ./dist-electron/esa-climate-from-space-$$VERSION-*.zip gs://esa-cfs-versions/electron/$$VERSION/
options:
  machineType: "E2_HIGHCPU_8"
timeout: 2500s
