steps:
  - name: 'node:22'
    id: 'ci'
    entrypoint: npm
    args: ['ci']
  - name: 'node:22'
    id: 'build'
    entrypoint: npm
    args: ['run', 'build']
  - name: 'node:22'
    id: 'resolve-version'
    entrypoint: 'node'
    args:
      - '-p'
      - 'const {version}=require("./package.json"); require("node:fs").writeFileSync("/workspace/deploy-version.env", `VERSION=${version}\n`);'
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'deploy'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        . /workspace/deploy-version.env
        gsutil rsync -r -d ./dist "gs://esa-cfs-versions/web/${VERSION}"
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'setmeta'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        . /workspace/deploy-version.env
        gsutil setmeta -h 'cache-control:no-cache' "gs://esa-cfs-versions/web/${VERSION}/*"
